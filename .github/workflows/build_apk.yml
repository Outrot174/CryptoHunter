name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare BIP-39 Wordlist & App Icon
        run: |
          mkdir -p app/src/main/assets
          curl -sSL https://raw.githubusercontent.com/bitcoin/bips/master/bip-0039/english.txt -o app/src/main/assets/bip39_english.txt
          if [ -f "icon.png" ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            cp icon.png app/src/main/res/drawable-nodpi/ic_launcher.png
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoHunter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
